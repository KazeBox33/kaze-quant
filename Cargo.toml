[package]
name = "kaze-quant"
version = "0.8.0"
edition = "2024"
default-run = "kaze-quant"
rust-version = "1.99"
description = "Auditable Rust replay, strategy research, live paper trading and testnet execution"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "limits", "backup"] }

[[bin]]
name = "kaze-paper"
path = "src/bin/paper.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"


[[bin]]
name = "kaze-run"
path = "src/bin/run.rs"

[features]
default = []
network = ["dep:reqwest", "dep:hmac", "dep:tungstenite"]

[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "json", "rustls-tls"]
optional = true

[dependencies.hmac]
version = "0.12"
optional = true

[dependencies.tungstenite]
version = "0.28"
features = ["rustls-tls-webpki-roots"]
optional = true

[[bin]]
name = "kaze-testnet"
path = "src/bin/testnet.rs"
required-features = ["network"]

[[bin]]
name = "kaze-live-paper"
path = "src/bin/live_paper.rs"
required-features = ["network"]

[[bin]]
name = "kaze-research"
path = "src/bin/research.rs"
