[package]
name = "kaze-quant"
version = "0.2.0"
edition = "2024"
default-run = "kaze-quant"
rust-version = "1.99"
description = "Deterministic Rust replay and durable multi-instrument paper trading"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "kaze-paper"
path = "src/bin/paper.rs"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

