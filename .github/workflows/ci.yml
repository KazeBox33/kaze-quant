name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - run: cargo test --locked --all-features --all-targets
      - run: cargo test --locked --all-features --release
      - run: cargo doc --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 scripts/test_market_data.py
      - run: python3 scripts/test_research_data.py
      - run: python3 scripts/test_research_holdout.py
      - run: python3 scripts/test_event_time_data.py
      - run: python3 scripts/test_testnet_acceptance.py
      - name: Replay and recover paper session
        run: |
          cargo run --locked --release --bin kaze-paper -- --input data/paper.jsonl --journal reports/ci.wal --finish --report reports/first.json
          cargo run --locked --release --bin kaze-paper -- --input data/paper.jsonl --journal reports/ci.wal --finish --report reports/retry.json
          cargo run --locked --example custom_strategy
          cargo run --locked --release --example durable_strategy -- reports/ci-pulse.db
          cargo run --locked --release --example durable_strategy -- reports/ci-pulse.db
          cargo run --locked --features network --bin kaze-testnet -- --help
          cargo run --locked --features network --bin kaze-live-paper -- --help
      - name: Transactional replay and backup
        run: |
          cargo run --locked --release --bin kaze-run -- --input data/paper.jsonl --db reports/ci.db --finish --verify-full --report reports/sql-first.json --backup reports/ci-backup.db
          cargo run --locked --release --bin kaze-run -- --db reports/ci-backup.db --recover-only --verify-full --report reports/sql-backup.json
      - name: Reproducible storage comparison
        run: |
          cargo run --locked --release --example store_bench -- 2000 | tee reports/ci-store.csv
          cargo run --locked --release --example history_recovery_bench > reports/ci-history.json
          rustc -vV > reports/rustc.txt
          uname -a > reports/host.txt
      - name: Durable target position and paper TWAP crash recovery
        run: |
          cargo build --locked --release --bin kaze-run --example target_reference
          python3 scripts/target_acceptance.py --output reports/ci-target-crash
      - name: External plan sends only after durable intent and never replays send permission
        run: |
          cargo build --locked --release --example external_plan_demo
          python3 scripts/plan_crash.py --output reports/ci-plan-before-post
          target/release/examples/external_plan_demo demo reports/ci-plan-demo > reports/ci-plan-demo.json
      - name: Net target compiler original asset examples
        run: |
          cargo build --locked --release --example net_target_demo
          target/release/examples/net_target_demo reports/ci-net-target > reports/ci-net-target.json
      - name: Causal bar ATR strategy generates and recovers paper trades
        run: |
          cargo build --locked --release --bin kaze-run
          target/release/kaze-run --config configs/bar-atr-demo.json --input data/bar-atr-demo.jsonl --db reports/ci-bar.db --finish --verify-full --report reports/ci-bar.json
          target/release/kaze-run --config configs/bar-atr-demo.json --db reports/ci-bar.db --recover-only --verify-full --report reports/ci-bar-recovery.json
      - name: Unified paper execution matches BestLimit source intent trace and survives crashes
        run: |
          cargo build --locked --release --bin kaze-run --example algo_reference
          python3 scripts/algo_crash.py --output reports/ci-algo-crash
          python3 scripts/algo_compare.py --binary target/release/examples/algo_reference --source docs/evidence/v16/upstream-best-limit.py.txt --output reports/ci-best-limit-compare --repeats 1
      - name: Managed strategy ownership and lifecycle survive committed crash stages
        run: |
          cargo build --locked --release --bin kaze-run --example managed_reference
          python3 scripts/managed_crash.py --output reports/ci-managed-crash
      - name: Local conditional CTA survives committed crash stages
        run: |
          cargo build --locked --release --bin kaze-run
          python3 scripts/conditional_crash.py --output reports/ci-conditional-crash
      - name: Slot storage matches frozen legacy economic checkpoints
        run: |
          cargo run --locked --release --example order_store_replay > reports/ci-orders.jsonl
          python3 -c 'import json,pathlib; load=lambda p:[json.loads(s) for s in pathlib.Path(p).read_text().splitlines()]; assert load("reports/ci-orders.jsonl")==load("docs/evidence/v14/replay-old.jsonl")'
      - name: Immutable net target survives crash and enforces original fee budget
        run: |
          cargo build --locked --release --example net_execution_demo
          python3 scripts/net_execution_crash.py --output reports/ci-net-execution-crash
          target/release/examples/net_execution_demo target reports/ci-net-execution > reports/ci-net-execution.json
          target/release/examples/net_execution_demo budget reports/ci-net-budget > reports/ci-net-budget.json
          target/release/examples/net_execution_demo residual reports/ci-net-residual > reports/ci-net-residual.json
      - uses: actions/upload-artifact@v4
        with:
          name: storage-evidence-${{ matrix.os }}
          path: |
            reports/ci-store.csv
            reports/ci-history.json
            reports/rustc.txt
            reports/host.txt
            reports/sql-first.json
            reports/sql-backup.json
            reports/ci-target-crash/summary.json
            reports/ci-plan-before-post/summary.json
            reports/ci-plan-demo.json
            reports/ci-net-target.json
            reports/ci-bar.json
            reports/ci-bar-recovery.json
            reports/ci-orders.jsonl
            reports/ci-conditional-crash/summary.json
            reports/ci-managed-crash/summary.json
            reports/ci-algo-crash/summary.json
            reports/ci-best-limit-compare/summary.json
            reports/ci-net-execution-crash/summary.json
            reports/ci-net-execution.json
            reports/ci-net-budget.json
            reports/ci-net-residual.json
